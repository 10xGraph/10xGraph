[pytest]
# Standalone config: no coverage addopts from the library's pyproject.toml.
asyncio_mode = auto
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
markers =
    needs_openai: live test, skipped unless OPENAI_API_KEY is set (agent under test, gpt-5-mini)
    needs_anthropic: live test, skipped unless ANTHROPIC_API_KEY is set (judge, claude-sonnet-5-5)
    needs_gemini: live test, skipped unless GEMINI_API_KEY or GOOGLE_API_KEY is set (gemini-2.5-flash)
