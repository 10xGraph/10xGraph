server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser talks to /api on its own origin, so no CORS setup is needed.
  # Streaming needs buffering off, otherwise tokens arrive in one burst.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri /index.html;
  }
}
